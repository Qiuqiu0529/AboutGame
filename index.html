<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Game</title>
    <link rel="stylesheet" href="styles.css?v=5" />
  </head>
  <body class="reader-page">
    <header class="topbar water-topbar">
      <a class="brand" href="index.html">About Game</a>
      <p class="water-count" id="waterCount">纸船正在靠岸</p>
    </header>

    <main class="water-scene" id="waterScene" aria-label="文章纸船水面">
      <div class="water-glow" aria-hidden="true"></div>
      <div class="wave-layer wave-layer-back" aria-hidden="true"></div>
      <div class="wave-layer wave-layer-mid" aria-hidden="true"></div>
      <div class="wave-layer wave-layer-front" aria-hidden="true"></div>
      <div class="boat-field" id="boatField"></div>

      <section class="note-overlay" id="noteOverlay" hidden>
        <article class="article-note" id="articleNote" role="dialog" aria-modal="false" aria-labelledby="noteTitle">
          <p class="note-rating" id="noteRating">个人感受 --/10</p>
          <h1 id="noteTitle">文章标题</h1>
          <p class="note-category" id="noteCategory">分类</p>
          <div class="note-tags" id="noteTags"></div>
          <a class="note-link" id="noteLink" href="#" target="_blank" rel="noreferrer">打开文章</a>
        </article>
      </section>
    </main>

    <script src="data.js?v=3"></script>
    <script src="app.js?v=7"></script>
  </body>
</html>
